<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mariana.</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Querida mariana.</strong>
                        <p>
                           Mariana, gosto de estar contigo porque tudo fica mais leve. 
                           Cada conversa, cada risada, cada olhar me lembra do quanto somos interligados.   
                           Você faz as coisas simples parecerem importantes, e estar ao seu lado torna tudo mais fácil de encarar.
                           Eu te amo Mariana.
                        </p>
                        <p style="text-align: center;">
                           <i>Com amor, Daniel.</i>💌
                                                                                                                              
                        </p>
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
    </div>
    <script>
        const envelope = document.querySelector('.envelope-wrapper');
        envelope.addEventListener('click', () => {
            envelope.classList.toggle('flap');
        });
    </script>
</body>
</html>
